name: Ruff

on:
    push:
        branches: ["main"]
        paths:
            - "python/**"
    pull_request:
        branches: ["main"]
        paths:
            - "python/**"

jobs:
    ruff:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Run ruff lint
              working-directory: python/lorawan
              run: uvx ruff check .

            - name: Run ruff format check
              working-directory: python/lorawan
              run: uvx ruff format --check src/ tests/ scripts/
