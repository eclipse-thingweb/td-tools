name: LoRaWAN CI Pipeline

on:
    push:
        branches: ["main"]
        paths:
            - "python/**"
    pull_request:
        branches: ["main"]
        paths:
            - "python/**"

jobs:
    test:
        name: Tests (ubuntu-latest, Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version: ["3.11", "3.12", "3.13"]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: true

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Run tests
              working-directory: python/lorawan
              run: uv run --dev pytest
