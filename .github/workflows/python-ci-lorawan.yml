name: LoRaWAN CI Pipeline

on:
    # Run on every branch, not only main. A fork's feature branches otherwise
    # get no CI at all, so the first execution of these tests is the pull
    # request against upstream — which is how a latent failure on main went
    # unnoticed until it surfaced in an unrelated contributor's PR.
    push:
        branches: ["**"]
        paths:
            - "python/**"
    pull_request:
        branches: ["main"]
        paths:
            - "python/**"

jobs:
    test:
        name: Tests (ubuntu-latest, Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version: ["3.11", "3.12", "3.13"]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: true

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Generate device catalog
              working-directory: python/lorawan
              run: uv run python -m scripts.generate_device_tds

            - name: Run tests
              working-directory: python/lorawan
              run: uv run --dev pytest
