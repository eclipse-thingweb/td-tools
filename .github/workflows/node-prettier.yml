name: Prettier

on:
    push:
        branches: ["main"]
        paths:
            - "node/**"
    pull_request:
        # The branches below must be a subset of the branches above
        branches: ["main"]
        paths:
            - "node/**"

defaults:
    run:
        working-directory: node

jobs:
    prettier:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install prettier
              run: npm install prettier@2.3.2

            - name: Run prettier
              run: npm run format:check
