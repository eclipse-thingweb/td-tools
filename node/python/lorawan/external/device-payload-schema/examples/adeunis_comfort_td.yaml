# Example: Adeunis Comfort 2 (0x4C) historical data frame
# Source reference:
# - https://github.com/TheThingsNetwork/lorawan-devices/blob/master/vendor/adeunis/comfort_lib.js

name: adeunis_comfort_td
version: 1
endian: big
description: Adeunis Comfort 2 basic temperature/humidity channel decoding for 0x4C data frames
manufacturer: Adeunis
device: Comfort Temperature Humidity 2

fields:
  - name: frame_code
    type: u8
    description: Frame identifier (0x4C for Comfort 2 data)

  - byte_group:
      size: 1
      fields:
        - name: frame_counter
          type: u8[5:7]
        - name: configuration_inconsistency
          type: u8[3:3]
        - name: has_timestamp
          type: u8[2:2]
        - name: low_battery
          type: u8[1:1]
        - name: configuration_done
          type: u8[0:0]

  # values: [t=0, t-1, t-2, ...]
  - name: temperature_t0
    type: s16
    div: 10
    unit: "°C"
  - name: humidity_t0
    type: u8
    unit: "%"

  - name: temperature_t1
    type: s16
    div: 10
    unit: "°C"
  - name: humidity_t1
    type: u8
    unit: "%"

  - name: temperature_t2
    type: s16
    div: 10
    unit: "°C"
  - name: humidity_t2
    type: u8
    unit: "%"

  - name: temperature_t3
    type: s16
    div: 10
    unit: "°C"
  - name: humidity_t3
    type: u8
    unit: "%"

  - name: temperature_t4
    type: s16
    div: 10
    unit: "°C"
  - name: humidity_t4
    type: u8
    unit: "%"

  - name: temperature_t5
    type: s16
    div: 10
    unit: "°C"
  - name: humidity_t5
    type: u8
    unit: "%"

  - match:
      field: $has_timestamp
      default: skip
      cases:
        1:
          - name: timestamp_raw
            type: u32
            description: Seconds since 2013-01-01T00:00:00Z (Adeunis epoch)

test_vectors:
  - name: comfort2_data_ttn_reference
    description: "Official TTN example payload for 0x4C frame"
    payload: "4C 96 00C5 1F 00C7 20 00C8 21 00CA 22 00CC 23 00CD 24 14ABA3E9"
    expected:
      frame_code: 76
      frame_counter: 4
      configuration_inconsistency: 0
      has_timestamp: 1
      low_battery: 1
      configuration_done: 0
      temperature_t0: 19.7
      humidity_t0: 31
      temperature_t1: 19.9
      humidity_t1: 32
      temperature_t2: 20.0
      humidity_t2: 33
      temperature_t3: 20.2
      humidity_t3: 34
      temperature_t4: 20.4
      humidity_t4: 35
      temperature_t5: 20.5
      humidity_t5: 36
      timestamp_raw: 346792937

  - name: comfort2_data_negative_temperatures
    description: "Synthetic payload covering negative values and status flags"
    payload: "4C A5 00D5 28 0000 37 FFCA 3C FF9C 41 0141 46 01C8 4B 00000001"
    expected:
      frame_code: 76
      frame_counter: 5
      configuration_inconsistency: 0
      has_timestamp: 1
      low_battery: 0
      configuration_done: 1
      temperature_t0: 21.3
      humidity_t0: 40
      temperature_t1: 0.0
      humidity_t1: 55
      temperature_t2: -5.4
      humidity_t2: 60
      temperature_t3: -10.0
      humidity_t3: 65
      temperature_t4: 32.1
      humidity_t4: 70
      temperature_t5: 45.6
      humidity_t5: 75
      timestamp_raw: 1

  - name: comfort2_data_no_timestamp
    description: "Same 0x4C data layout without trailing timestamp"
    payload: "4C 92 00C5 1F 00C7 20 00C8 21 00CA 22 00CC 23 00CD 24"
    expected:
      frame_code: 76
      frame_counter: 4
      configuration_inconsistency: 0
      has_timestamp: 0
      low_battery: 1
      configuration_done: 0
      temperature_t0: 19.7
      humidity_t0: 31
      temperature_t1: 19.9
      humidity_t1: 32
      temperature_t2: 20.0
      humidity_t2: 33
      temperature_t3: 20.2
      humidity_t3: 34
      temperature_t4: 20.4
      humidity_t4: 35
      temperature_t5: 20.5
      humidity_t5: 36
